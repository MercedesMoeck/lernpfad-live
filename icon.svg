<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181109"/>
      <stop offset="1" stop-color="#0b0805"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eccb8f"/>
      <stop offset="0.5" stop-color="#c39559"/>
      <stop offset="1" stop-color="#8a6636"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.4" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#f7e6c6"/>
      <stop offset="0.72" stop-color="#dcb987"/>
      <stop offset="1" stop-color="#b0854e"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#ground)"/>

  <!-- atmospheric bloom -->
  <circle cx="256" cy="176" r="118" fill="#d24b3b" opacity="0.13" filter="url(#soft)"/>

  <!-- mysterious disc, rising above the gate -->
  <circle cx="256" cy="150" r="56" fill="url(#disc)"/>
  <path d="M204 168a56 56 0 0 0 104 0z" fill="#0b0805" opacity="0.14"/>

  <!-- horizon -->
  <path d="M92 402 H420" stroke="#d24b3b" stroke-width="8" stroke-linecap="round" opacity="0.72"/>

  <!-- torii -->
  <g fill="url(#brass)" stroke="#3a2a17" stroke-width="2" stroke-linejoin="round">
    <!-- kasagi: top lintel, gently upturned -->
    <path d="M104 172 q152 -42 304 0 l0 30 q-152 -36 -304 0 z"/>
    <!-- shimaki -->
    <rect x="126" y="222" width="260" height="24" rx="4"/>
    <!-- nuki (tie beam) -->
    <rect x="140" y="292" width="232" height="20" rx="3"/>
    <!-- pillars: straight, leaning very slightly inward at the top -->
    <path d="M156 204 h24 l4 214 h-32 z"/>
    <path d="M356 204 h-24 l-4 214 h32 z"/>
    <!-- gakuzuka (centre strut) -->
    <rect x="246" y="256" width="20" height="36"/>
  </g>

  <!-- seal frame -->
  <rect x="36" y="36" width="440" height="440" rx="78"
        fill="none" stroke="url(#brass)" stroke-width="9" opacity="0.46"/>
</svg>
